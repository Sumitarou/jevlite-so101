# M4b：シミュレータの画像から none / edge / center を判定する判定器（Jev もどき本体）。
# 単位は m・rad・s。棒・台・カメラは configs/sim.yaml、領域 → 選択肢は configs/m4a.yaml の zones。

# 学習用の画像の生成（scripts/sim/gen_intruder_data.py、位置の抜き方は scripts/sim/intruder_sampling.py）
# お手本の軌道（scripts/sim/demo_plan.Planner）を流しながら、hold_ticks ごとに棒を新しい位置へ set_pose し、
# 各配置で 1 枚保存する（実測の pose に新しい位置が現れてから settle_frames 枚より後の最初の画像）。ラベルは棒の実測の位置から intruder.zone_of で決める（M4a と同じ規則）
data:
  out_dir: data/sim_intruder
  seed_base: 2000           # エピソード i のお手本の種 = seed_base + i（ACT のお手本 0〜49・評価 100〜119 と重ならない）
  episodes: 120             # 試しの 3 本：1 本 約 80 枚・約 35 s（実時間）→ 約 9,600 枚・約 75 分
  hold_ticks: 4             # 棒を同じ位置に置く刻み数（30 Hz で 0.133 s）
  settle_frames: 1          # set_pose が実測の pose に現れてから、この枚数より後の画像だけ使う
  pose_tol_m: 0.001         # 指令した位置と実測の位置の差の上限（超えたら捨てる）
  png_compress_level: 3
  split:                    # エピソード単位（種から決まる。枚数を変えても同じ種は同じ分け方）
    seed: 7
    train: 0.70
    val: 0.15               # 残りが test
  sampling:
    park_frac: 0.10         # 待機位置（画面の外。none）
    path_frac: 0.20         # M4a の通り道の近く（x = path.x ± path_dx、+y 側）
    path_dx: 0.015
    zones: {none: 1.0, edge: 1.0, center: 1.0}  # 台の上の配置の、領域の比
    near_frac: 0.5          # 各領域の中で、境目（白い面の縁・帯の外縁）から near_m 以内に置く割合
    near_m: 0.015
    none_margin: 0.08       # none を置く範囲：帯の外縁からこの幅まで（台の上）
    block_clear_m: 0.06     # ブロックの中心からこの距離の内には置かない（棒がブロックに刺さらない）
    arm_clear_m: 0.003      # アームの点（メッシュの凸包の点）から棒の表面までこの距離の内には置かない（アームを貫かない）
    max_tries: 2000
  arm_near_m: 0.05          # 「アームが近い」：アームの点と棒の表面の水平距離がこの値以下（棒の高さの範囲の点だけ）
  near_eval_m: 0.01         # 評価の「境目付近」：境目までの距離がこの値以下

# 判定器の前処理：画像（640×480）から切り出す範囲 [u0, v0, u1, v1]（画素、右下は含まない）。
# 帯の外周の 4 隅（u 127〜513、v 216〜455）に、左右 3 cm 相当・上 80 px（棒の上の部分）の余白を足した。
# カメラの位置を変えたら見直す（tests/test_m4b_student.py が帯の 4 隅が入ることを確かめる）
crop: [96, 136, 544, 480]
zones_config: configs/m4a.yaml   # 領域 → 選択肢（zones）

siglip:                   # v0・v1 の画像の特徴（configs/zeroshot.yaml と同じモデル・revision）
  model_id: google/siglip-base-patch16-224
  revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
  device: auto
  dtype: float16
  size: 224               # 切り出した画像をこの正方形へ縮める（SigLIP の入力）

v0:                       # ゼロショット（学習なし）。プロンプトは領域ごと。手向けの configs/choices.yaml とも比べる
  prompts:
    none:
      - "a robot arm on a table with a white sheet and a green border, nothing else on the table"
      - "an empty white area surrounded by green tape, no red rod"
    edge:
      - "a red rod standing on the green tape border, outside the white area"
      - "a red stick on the green border next to the white sheet"
    center:
      - "a red rod standing on the white area"
      - "a red stick on top of the white sheet"

v1:                       # SigLIP の特徴（凍結）→ 多クラスのロジスティック回帰（scikit-learn で学習、推論は numpy）
  features: [pooled, grid2]  # pooled：MAP の出力（768）／ grid2：パッチの特徴を 2×2 の格子で平均（4 × 768）。
                             # 本番のデータの val：pooled だけ 0.899、pooled + grid2 0.938 → 後者を採用
  C: [0.01, 0.1, 1.0, 10.0]   # val の正解率（同点なら center→CONTINUE の少ない方）で選ぶ
  class_weight: balanced
  max_iter: 3000
  batch: 64               # 特徴の抽出のバッチ

v2:                       # MobileNetV3-Small（torchvision、ImageNet の重み）の微調整
  arch: mobilenet_v3_small
  weights: IMAGENET1K_V1
  input: [320, 240]       # 切り出した画像をこの大きさ（幅, 高さ）へ縮める
  epochs: 15
  batch: 64
  lr: 0.001
  weight_decay: 0.0001
  jitter: 0.1             # 明るさ・コントラストの揺らぎ（±）
  shift_px: 4             # 平行移動（±、入力の画素）。左右反転はしない（配置が非対称）
  seed: 0
  workers: 4

# 安全側の調整：判定器の種類ごとに、領域の logit に足す値。val で center→CONTINUE が出たときだけ使い、
# val で center→CONTINUE が 0 になる最小の値（0.5 刻み）にする。test は見ずに決める
logit_bias:
  v1: {none: 0.0, edge: 0.0, center: 1.5}   # models/judge/20261012_095718_v1_grid：val の center→none 1 → 0（正解率 0.938 → 0.929）
  v2: {none: 0.0, edge: 0.0, center: 0.0}   # models/judge/20261012_100019_v2：val の center→none 0

eval:
  bench_n: 1000           # 遅れの計測の回数（warmup の後）
  warmup: 20
  gate_config: configs/gate_sim.yaml  # 確信度の分布で印を付ける値（G2 の min_conf）はここから読む
